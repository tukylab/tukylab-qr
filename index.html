<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFDF5">
<title>tukylab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Montserrat:wght@400;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --amarillo: #F5E660;
    --tinta: #15140F;
    --hueso: #FFFDF5;
  }

  * { box-sizing: border-box; }

  html { color-scheme: light; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--hueso);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--tinta);
    padding: max(32px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
             max(32px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    text-align: center;
  }

  .card {
    max-width: 420px;
    width: 100%;
  }

  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    animation: pulse 1.6s ease-in-out infinite;
  }

  .logo img { width: 100%; height: 100%; display: block; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
  }

  .tagline {
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: var(--tinta);
    margin: 0 0 36px;
  }

  .eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--tinta);
    opacity: 0.55;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Quicksand', 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.2;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }

  .highlight {
    background: var(--amarillo);
    padding: 2px 10px;
    border-radius: 6px;
  }

  .subtext {
    font-size: 16px;
    line-height: 1.5;
    color: var(--tinta);
    opacity: 0.75;
    margin: 0 0 32px;
    min-height: 1.5em;
  }

  .btn {
    display: inline-block;
    width: 100%;
    background: var(--amarillo);
    color: var(--tinta);
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 24px;
    border-radius: 100px;
    border: 2px solid var(--tinta);
    box-shadow: 4px 4px 0px var(--tinta);
    transition: transform 0.08s ease;
    cursor: pointer;
    min-height: 44px;
  }

  .btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--tinta);
  }

  .btn:focus-visible {
    outline: 3px solid var(--tinta);
    outline-offset: 3px;
  }

  .reminder {
    margin-top: 28px;
    font-size: 14px;
    line-height: 1.5;
    opacity: 0.7;
  }

  .reminder b { opacity: 1; }

  /* Visualmente oculto pero disponible para lectores de pantalla */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>

    <h1>Mostrale a todas<br><span class="highlight">tu vibe</span> ✨</h1>
    <p class="subtext" id="subtext" data-default="Si no pasa nada en unos segundos, tocá el botón.">Si no pasa nada en unos segundos, tocá el botón.</p>

    <a class="btn" id="fallback-btn" href="https://www.instagram.com/tukylab" target="_blank" rel="noopener">
      Abrir cámara de Instagram
    </a>

    <p class="reminder">Cuando subas tu historia, <b>etiquetanos @tukylab</b> 💛 nos encanta ver cómo los combinás.</p>

    <p class="sr-only" id="status-live" role="status" aria-live="polite"></p>
  </div>

<script>
(function () {
  'use strict';

  var UA = navigator.userAgent || '';

  // ---------- Detección de plataforma ----------

  function isIOSDevice() {
    var classic = /iPad|iPhone|iPod/.test(UA) && !window.MSStream;
    // iPadOS 13+ se identifica como "MacIntel" pero tiene soporte táctil multi-touch
    var iPadOS13Up = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
    return classic || iPadOS13Up;
  }

  function isHarmonyOS() {
    // HarmonyOS NEXT (sin capa Android) suele exponer alguno de estos tokens.
    // HarmonyOS 2-4 (basado en AOSP) generalmente sigue reportando "Android"
    // para no romper la compatibilidad web, así que también cae en isAndroidLike().
    return /HarmonyOS|OpenHarmony|HuaweiBrowser|HMSCore/i.test(UA);
  }

  function isAndroidLike() {
    return /Android/i.test(UA) || isHarmonyOS();
  }

  function isMobile() {
    return isIOSDevice() || isAndroidLike();
  }

  // Motor Chromium real: intent:// solo lo entienden navegadores basados en
  // Chromium (Chrome, Samsung Internet, Huawei Browser, Opera, Edge Android).
  // Firefox Android (Gecko) NO lo entiende y puede mostrar un error si se lo mandamos.
  function isChromiumEngine() {
    var chromiumTokens = /Chrome\/|SamsungBrowser\/|HuaweiBrowser\/|OPR\/|EdgA\//i.test(UA);
    var isFirefox = /Firefox|FxiOS/i.test(UA);
    return chromiumTokens && !isFirefox;
  }

  // WebViews embebidos conocidos por bloquear o restringir esquemas personalizados.
  function isInAppBrowser() {
    return /FBAN|FBAV|Instagram|Line\/|MicroMessenger|WhatsApp|TikTok/i.test(UA);
  }

  // ---------- Links ----------

  var PROFILE_URL = 'https://www.instagram.com/tukylab';

  var LINKS = {
    iosScheme: 'instagram://story-camera',
    profile: PROFILE_URL
  };

  // Ninguno de estos paths es una API oficial de Instagram: son esquemas
  // reverse-engineered que la app Android puede o no seguir honrando según
  // la versión instalada. Por eso probamos varias variantes conocidas en
  // cadena, de la más específica a la más genérica, en vez de apostar a una sola.
  function androidCandidates() {
    var fallback = encodeURIComponent(PROFILE_URL);
    return [
      'instagram://story-camera',
      'intent://story-camera#Intent;scheme=instagram;package=com.instagram.android;S.browser_fallback_url=' + fallback + ';end',
      'instagram://camera',
      'intent://camera#Intent;scheme=instagram;package=com.instagram.android;S.browser_fallback_url=' + fallback + ';end'
    ];
  }

  // ---------- Estado compartido ----------

  var fallbackBtn = document.getElementById('fallback-btn');
  var subtextEl   = document.getElementById('subtext');
  var statusEl    = document.getElementById('status-live');

  var appLikelyOpened = false; // true = probablemente Instagram abrió (o el usuario se fue)
  var isProcessing = false;    // evita que taps repetidos apilen timers
  var pendingTimers = [];

  function clearPendingTimers() {
    for (var i = 0; i < pendingTimers.length; i++) clearTimeout(pendingTimers[i]);
    pendingTimers = [];
  }

  function markAppOpened() {
    appLikelyOpened = true;
    clearPendingTimers();
    isProcessing = false;
  }

  // Señales reales de que la app se abrió (o de que el usuario navegó fuera).
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      markAppOpened();
    } else {
      // El usuario volvió al navegador: reset limpio para que un próximo tap funcione bien.
      appLikelyOpened = false;
      isProcessing = false;
    }
  });
  window.addEventListener('pagehide', markAppOpened);

  function safeNavigate(url) {
    try {
      window.location.href = url;
    } catch (err) {
      // Algunos navegadores lanzan un error al no reconocer un esquema.
      // Lo silenciamos a propósito: el siguiente paso del flujo se hace cargo.
    }
  }

  function setStatus(msg) {
    if (statusEl) statusEl.textContent = msg;
  }

  function setSubtext(msg) {
    if (subtextEl) subtextEl.textContent = msg;
  }

  // ---------- Ajustes de copy según contexto (sin tocar diseño) ----------

  if (isInAppBrowser()) {
    setSubtext('Para continuar, abrí este link en Safari o Chrome desde el menú de tu navegador.');
  } else if (typeof navigator.onLine === 'boolean' && !navigator.onLine) {
    setSubtext('Parece que no tenés conexión a internet en este momento.');
  }

  window.addEventListener('online', function () {
    if (subtextEl && subtextEl.textContent.indexOf('conexión') !== -1) {
      setSubtext(subtextEl.getAttribute('data-default'));
    }
  });

  // ---------- Intento automático (best-effort, sin forzar fallback a perfil) ----------
  //
  // Muchos navegadores móviles bloquean la navegación a esquemas personalizados
  // si no viene de un gesto directo del usuario. Este intento es "gratis": si
  // funciona, mejor; si no, el botón manual (más abajo) es el flujo garantizado.
  // A propósito NO se redirige automáticamente al perfil desde acá: forzar una
  // navegación sin que la persona haya tocado nada sería un fallback prematuro.

  // Prueba una lista de URLs en cadena: intenta la primera, espera un poco,
  // y si seguimos en la página (no se abrió nada) prueba la siguiente.
  // Se detiene apenas detecta que la app tomó el control (appLikelyOpened).
  function tryCandidateChain(candidates, index, onExhausted) {
    if (index >= candidates.length) {
      onExhausted();
      return;
    }
    var url = candidates[index];
    var isIntentUrl = url.indexOf('intent://') === 0;

    // El formato intent:// solo lo entienden navegadores Chromium; en otros
    // (Firefox Android) lo saltamos directo para no arriesgar una página de error.
    if (isIntentUrl && !isChromiumEngine()) {
      tryCandidateChain(candidates, index + 1, onExhausted);
      return;
    }

    safeNavigate(url);
    var t = setTimeout(function () {
      if (!appLikelyOpened) {
        tryCandidateChain(candidates, index + 1, onExhausted);
      }
    }, 450);
    pendingTimers.push(t);
  }

  function attemptAutoOpen() {
    if (!isMobile() || isInAppBrowser()) return;

    appLikelyOpened = false;
    setStatus('Abriendo la cámara de Instagram…');

    if (isIOSDevice()) {
      safeNavigate(LINKS.iosScheme);
      return;
    }

    // Android/HarmonyOS: best-effort, sin forzar fallback a perfil desde el auto-intento
    tryCandidateChain(androidCandidates(), 0, function () { /* sin acción: es best-effort */ });
  }

  if (document.readyState === 'complete') {
    attemptAutoOpen();
  } else {
    window.addEventListener('load', attemptAutoOpen);
  }

  // ---------- Flujo manual (el más confiable — arma el fallback final) ----------

  function attemptManualOpen() {
    if (isProcessing) return; // ignora taps repetidos mientras hay un intento en curso
    isProcessing = true;
    appLikelyOpened = false;
    clearPendingTimers();
    setStatus('Abriendo la cámara de Instagram…');

    function goToProfileIfStillHere() {
      if (!appLikelyOpened) {
        setStatus('No pudimos abrir Instagram automáticamente. Te llevamos a tu perfil.');
        safeNavigate(LINKS.profile);
      }
      isProcessing = false;
    }

    if (isIOSDevice()) {
      safeNavigate(LINKS.iosScheme);
      pendingTimers.push(setTimeout(goToProfileIfStillHere, 1500));
      return;
    }

    // Android / HarmonyOS: recorre todas las variantes conocidas y, si ninguna
    // funcionó, recién ahí cae al perfil. Este es el flujo garantizado.
    tryCandidateChain(androidCandidates(), 0, goToProfileIfStillHere);
  }

  if (fallbackBtn) {
    fallbackBtn.addEventListener('click', function (e) {
      if (!isMobile()) return; // desktop: el href normal ya lleva al perfil, sin deep links
      e.preventDefault();
      attemptManualOpen();
    });
  }
})();
</script>
</body>
</html>
