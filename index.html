<title>tukylab</title>

<style>
  :root {
    --amarillo: #F5E660;
    --tinta: #15140F;
    --hueso: #FFFDF5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--hueso);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', -apple-system, sans-serif;
    color: var(--tinta);
    padding: 32px 24px;
    text-align: center;
  }

  .card {
    max-width: 420px;
    width: 100%;
  }

  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    animation: pulse 1.6s ease-in-out infinite;
  }

  .logo img { width: 100%; height: 100%; display: block; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .tagline {
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: var(--tinta);
    margin: 0 0 36px;
  }

  .eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--tinta);
    opacity: 0.55;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.2;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }

  .highlight {
    background: var(--amarillo);
    padding: 2px 10px;
    border-radius: 6px;
  }

  .subtext {
    font-size: 16px;
    line-height: 1.5;
    color: var(--tinta);
    opacity: 0.75;
    margin: 0 0 32px;
  }

  .btn {
    display: inline-block;
    width: 100%;
    background: var(--amarillo);
    color: var(--tinta);
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 24px;
    border-radius: 100px;
    border: 2px solid var(--tinta);
    box-shadow: 4px 4px 0px var(--tinta);
    transition: transform 0.08s ease;
    cursor: pointer;
  }

  .btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--tinta);
  }

  .reminder {
    margin-top: 28px;
    font-size: 14px;
    line-height: 1.5;
    opacity: 0.7;
  }

  .reminder b { opacity: 1; }
</style>
</head>

    <p class="eyebrow">tukylab</p>
    <h1>Mostrale a todas<br><span class="highlight">tu vibe</span> ✨</h1>
    <p class="subtext">Si no pasa nada en unos segundos, tocá el botón.</p>

    <a class="btn" id="fallback-btn" href="https://www.instagram.com/tukylab" target="_blank" rel="noopener">
      Abrir cámara de Instagram
    </a>

    <p class="reminder">Cuando subas tu historia, <b>etiquetanos @tukylab</b> 💛 nos encanta ver cómo la combinás.</p>
  </div>

<script>
  function isAndroid() {
    return /android/i.test(navigator.userAgent);
  }
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }

  var iosLink = "instagram://story-camera";
  var androidSchemeLink = "instagram://story-camera";
  var androidIntentLink = "intent://story-camera#Intent;scheme=instagram;package=com.instagram.android;S.browser_fallback_url=" + encodeURIComponent("https://www.instagram.com/tukylab") + ";end";
  var profileUrl = "https://www.instagram.com/tukylab";
  var fallback = document.getElementById('fallback-btn');

  // Si la app abre, el navegador queda oculto/pausado. Usamos esto para saber
  // si un intento falló en silencio y hay que probar el siguiente.
  var pageStillVisible = true;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pageStillVisible = false;
  });
  window.addEventListener('pagehide', function () { pageStillVisible = false; });

  function tryOpenInstagram() {
    pageStillVisible = true;

    if (isIOS()) {
      window.location.href = iosLink;
      return;
    }

    if (isAndroid()) {
      // Paso 1: esquema simple. Funciona en la mayoría de navegadores Android
      // (Samsung Internet, Firefox, WebViews de otras apps, etc.)
      window.location.href = androidSchemeLink;

      // Paso 2: si medio segundo después seguimos en la página, probamos el
      // formato intent:// que es el que exige específicamente Chrome. Este
      // ya incluye una URL de respaldo, así que si Instagram no está
      // instalado, Chrome cae solo en el perfil sin quedarse en blanco.
      setTimeout(function () {
        if (pageStillVisible) {
          window.location.href = androidIntentLink;
        }
      }, 500);
    }
  }

  // Intento automático apenas carga la página.
  // Nota: los navegadores móviles suelen bloquear este salto automático por
  // seguridad (requieren un toque directo de la persona), así que esto es
  // "mejor esfuerzo" — el botón de abajo es el que garantiza que funcione.
  window.addEventListener('load', tryOpenInstagram);

  fallback.addEventListener('click', function (e) {
    if (isAndroid() || isIOS()) {
      e.preventDefault();
      tryOpenInstagram();
      // si después de ambos intentos seguimos acá, vamos al perfil como respaldo final
      setTimeout(function () {
        if (pageStillVisible) {
          window.location.href = profileUrl;
        }
      }, 1600);
    }
    // en desktop, el href normal del botón ya lleva al perfil
  });
</script>
